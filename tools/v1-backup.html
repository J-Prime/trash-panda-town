<title>Trash Panda Town</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1b1836">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
:root{
  /* Layout: one phone-width column. Town = glowing sign, string lights, a stack of neighbour rows.
     Each game = raccoon speech bubble on top, board in the middle, thumb controls at the bottom. */
  --night:#1b1836; --dusk:#27234d; --alley:#373166; --line:#433d7a;
  --lamp:#ffb547; --lamp-deep:#b8701c; --moon:#fff3d6; --muted:#bdb6de;
  --mint:#79e2c0; --berry:#ff7096; --bin:#3f7a62; --ink:#2a2640;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--night)}
body{height:100%;margin:0;background:var(--night) radial-gradient(120% 55% at 50% 0%,#2e2963 0%,var(--night) 72%) no-repeat;color:var(--moon);font-family:var(--body);font-size:16px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------- Town ---------- */
.hub{overflow-y:auto;padding-block:12px 28px;gap:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hubtop{position:relative;padding-top:2px}
.stars{position:absolute;inset:0;pointer-events:none}
.stars span{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--moon);animation:tw 2.6s ease-in-out infinite alternate}
.moon{position:absolute;right:4px;top:78px;width:84px;height:84px;border-radius:50%;
  background:radial-gradient(circle at 30% 36%,rgba(42,38,64,.10) 0 9px,transparent 10px),radial-gradient(circle at 62% 62%,rgba(42,38,64,.08) 0 13px,transparent 14px),radial-gradient(circle at 70% 27%,rgba(42,38,64,.07) 0 6px,transparent 7px),var(--moon);
  box-shadow:0 0 40px rgba(255,243,214,.35),0 0 120px rgba(255,243,214,.14)}
.toprow{position:relative;display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--dusk);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 6px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--dusk);border:2px solid var(--line);display:grid;place-items:center;padding:0}
.lights{position:relative;margin-top:6px}
.lights svg{width:100%;height:auto;display:block}
.bulb.new{animation:flick 1.2s ease-out 1}
h1{position:relative;font-family:var(--display);font-weight:400;font-size:clamp(42px,12.5vw,58px);line-height:.9;margin:4px 0 10px;color:var(--lamp);text-shadow:0 4px 0 #7a4512,0 0 30px rgba(255,181,71,.45);text-wrap:balance}
.greet{position:relative;margin:0;font-size:17px;line-height:1.35;max-width:30ch}
.namebtn{background:none;border:none;padding:0;color:var(--lamp);font-weight:800;text-decoration:underline dotted;text-underline-offset:4px}
.lightnote{position:relative;margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.crew{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 14px 10px 8px;background:var(--dusk);border:2px solid var(--line);border-radius:22px;text-align:left;transition:transform .12s,border-color .12s}
.row:hover{border-color:#5b54a0}
.row:active{transform:scale(.98)}
.row .who{display:flex;flex-direction:column;min-width:0}
.row .game{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp)}
.row h3{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.05;margin:1px 0 0}
.row p{margin:3px 0 0;font-size:14px;line-height:1.3;color:var(--muted)}
.lv{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lv b{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:0;color:var(--moon);line-height:1.05}
.fact{margin:2px 0 0;padding:12px 14px;border-radius:18px;border:2px dashed var(--line);font-size:14px;line-height:1.4;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.fact svg{flex:none;color:var(--lamp);margin-top:2px}
.fact b{color:var(--moon);display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.dedi{margin:0;text-align:center;font-size:14px;color:var(--muted)}

/* ---------- Game shell ---------- */
.gamebar{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.back{background:var(--dusk);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 10px;font-weight:800;display:inline-flex;align-items:center;gap:2px}
.gtitle{flex:1;min-width:0;font-family:var(--display);font-size:20px;line-height:1.05}
.gtitle small{display:block;font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp)}
.bubble{display:flex;align-items:center;gap:8px;min-height:78px}
.bubble .face{flex:none}
.say{position:relative;flex:1;background:var(--moon);color:var(--ink);border-radius:18px;padding:8px 12px;font-size:15px;line-height:1.3;font-weight:600}
.say::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:var(--moon);border-left:0}
.say b{font-weight:800}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-block:8px;min-height:48px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--dusk);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.done{border-color:var(--mint);color:var(--mint)}
.chip .e{font-size:18px;line-height:1}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
#controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;padding-block:10px 16px;min-height:24px}
.hint{margin:0;text-align:center;font-size:13.5px;line-height:1.35;color:var(--muted);max-width:38ch}
.btn{font-family:var(--display);font-weight:400;font-size:18px;border:none;border-radius:16px;padding:11px 18px;background:var(--lamp);color:#3a2208;box-shadow:0 4px 0 var(--lamp-deep);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--lamp-deep)}
.btn.ghost{background:var(--alley);color:var(--moon);box-shadow:0 4px 0 #15122c}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 #15122c}
.btn.ghost.on{background:var(--berry);color:var(--ink);box-shadow:0 4px 0 #a8395a}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{font-size:14px;padding:5px 9px;border-radius:11px;box-shadow:0 3px 0 var(--lamp-deep)}
.shake{animation:shake .32s}

/* ---------- Snack Pop ---------- */
.pop-board{position:relative;border-radius:18px;overflow:hidden;touch-action:none;
  background:repeating-conic-gradient(#2c2857 0 25%,#242046 0 50%) 0 0/calc(var(--cell)*2) calc(var(--cell)*2);
  box-shadow:0 0 0 3px var(--line),0 14px 30px rgba(0,0,0,.35)}
.pc{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);display:grid;place-items:center;font-size:calc(var(--cell)*.62);line-height:1;transition:transform .24s cubic-bezier(.34,1.3,.64,1)}
.pc span{display:block;transition:transform .2s,opacity .2s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.28))}
.pc.sel{z-index:2}
.pc.sel span{transform:scale(1.2)}
.pc.sel::before{content:"";position:absolute;inset:3px;border-radius:14px;background:rgba(255,243,214,.15);box-shadow:inset 0 0 0 2px var(--moon)}
.pc.sp::after{content:"";position:absolute;inset:2px;border-radius:50%;border:3px dotted var(--lamp);animation:spin 4s linear infinite}
.pc.gone span{transform:scale(1.6);opacity:0}

/* ---------- Midnight Kitchen ---------- */
.mg-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.mg-orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.order{background:var(--dusk);border:2px solid var(--line);border-radius:18px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.order.ready{border-color:var(--mint);background:#24394f}
.oname{font-size:13px;font-weight:800;line-height:1.1}
.wants{display:flex;gap:2px;font-size:25px;line-height:1.2}
.mg-board{display:grid;grid-template-columns:repeat(6,var(--cell));grid-auto-rows:var(--cell);gap:5px;touch-action:none}
.mc{position:relative;border-radius:12px;background:#2b2755;display:grid;place-items:center;font-size:calc(var(--cell)*.6);line-height:1}
.mc span{display:block}
.mc i{position:absolute;right:4px;bottom:1px;font-style:normal;font-size:11px;font-weight:800;color:var(--muted)}
.mc.gen{background:var(--alley);box-shadow:inset 0 0 0 2px var(--lamp)}
.mc.want{box-shadow:inset 0 0 0 2px var(--mint)}
.mc.lifted span{opacity:.25}
.mc.merged span{animation:boing .42s}
.mc.spawn span{animation:drop .32s}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}

/* ---------- Bin Stacker ---------- */
.st-cv{display:block;border-radius:8px;box-shadow:0 0 0 4px var(--bin),0 0 0 7px #2a5444,0 14px 30px rgba(0,0,0,.35);touch-action:none}
.pad{display:flex;gap:8px;justify-content:center;width:100%}
.pad button{flex:1;max-width:66px;height:54px;border-radius:16px;border:none;background:var(--alley);box-shadow:0 4px 0 #15122c;display:grid;place-items:center;color:var(--moon);touch-action:none;padding:0}
.pad button.hot{background:var(--lamp);color:#3a2208;box-shadow:0 4px 0 var(--lamp-deep)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #15122c}
.pad button.hot:active{box-shadow:0 1px 0 var(--lamp-deep)}

/* ---------- Moon Bingo ---------- */
.bg-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.caller{display:flex;align-items:center;gap:12px;justify-content:center;height:78px}
.ball{width:76px;height:76px;flex:none;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fffdf6 0 14%,var(--moon) 15% 62%,#e9d29d 100%);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;line-height:.9;box-shadow:0 0 34px rgba(255,243,214,.42);font-variant-numeric:tabular-nums}
.ball small{font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:.12em}
.ball.in{animation:roll .5s cubic-bezier(.3,1.4,.6,1)}
.hist{display:flex;gap:6px}
.hist span{width:34px;height:34px;border-radius:50%;background:var(--alley);display:grid;place-items:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.card{display:grid;grid-template-columns:repeat(5,var(--bc));gap:5px;padding:10px;background:var(--dusk);border:2px solid var(--line);border-radius:20px}
.card .hd{font-family:var(--display);font-size:calc(var(--bc)*.48);color:var(--lamp);text-align:center;line-height:1.15}
.bcell{position:relative;height:var(--bc);border:none;border-radius:12px;background:var(--moon);color:var(--ink);font-weight:800;font-size:calc(var(--bc)*.4);display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.bcell svg{position:absolute;left:8%;top:8%;width:84%;height:84%;color:var(--berry);opacity:.88;animation:stamp .26s}
.bcell.free{background:var(--lamp);font-size:calc(var(--bc)*.2);letter-spacing:.08em;align-items:end;padding-bottom:2px}
.bcell.free svg{color:var(--ink);opacity:.35;animation:none}
.bcell.miss{box-shadow:0 0 0 3px var(--mint);animation:pulse 1.2s ease-in-out infinite}
.btn.ready{background:var(--mint);box-shadow:0 4px 0 #3c9a7c;animation:pulse 1s ease-in-out infinite}

/* ---------- Shiny Sort ---------- */
.jars{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 12px;padding-top:16px}
.jar{width:var(--jw);display:flex;flex-direction:column;align-items:center;background:none;border:none;padding:0;transition:transform .18s}
.jar .lid{width:78%;height:10px;margin-bottom:2px;border-radius:6px 6px 2px 2px;background:#7d78a8}
.jar .glass{width:100%;height:calc(var(--it)*4 + 30px);border-radius:10px 10px 22px 22px;background:rgba(255,243,214,.07);border:3px solid rgba(255,243,214,.32);display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:3px;padding:8px 0 6px}
.jar.sel{transform:translateY(-14px)}
.jar.sel .glass{border-color:var(--lamp)}
.jar.done .glass{border-color:var(--mint);box-shadow:0 0 18px rgba(121,226,192,.35)}
.jar.done .lid{background:var(--mint)}
.tr{width:var(--it);height:var(--it);flex:none;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--it)*.58);line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .15s}
.tr.up{transform:translateY(-6px)}

/* ---------- Modal, toast ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(14,12,32,.76);display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:340px;background:var(--dusk);border:2px solid var(--line);border-radius:28px;padding:20px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;animation:rise .38s cubic-bezier(.3,1.3,.6,1)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:0;color:var(--lamp);text-wrap:balance}
.sheet p{margin:0;line-height:1.4;max-width:30ch}
.reward{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:24px;color:var(--lamp)}
.mbtns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px}
#nameInput{width:100%;font:inherit;font-size:18px;font-weight:700;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--night);color:var(--moon);text-align:center;-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:55;background:var(--moon);color:var(--ink);padding:9px 16px;border-radius:18px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .3s,transform .3s;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.out{opacity:0;transform:translate(-50%,10px)}

@keyframes tw{from{opacity:.2}to{opacity:.85}}
@keyframes flick{0%,24%,48%{opacity:.15}12%,36%,100%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes boing{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes drop{0%{transform:translateY(-14px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes roll{0%{transform:translateX(-60px) rotate(-200deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes stamp{0%{transform:scale(1.8);opacity:0}100%{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes rise{0%{transform:translateY(40px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div id="app">
  <section id="hub" class="screen hub">
    <header class="hubtop">
      <div class="stars" id="stars"></div>
      <div class="moon" aria-hidden="true"></div>
      <div class="toprow">
        <span class="pill" id="hubCaps"></span>
        <button class="iconbtn" id="muteBtn" aria-label="Sound on or off"></button>
      </div>
      <div class="lights" id="lights"></div>
      <h1>Trash Panda<br>Town</h1>
      <p class="greet" id="greet"></p>
      <p class="lightnote" id="lightnote"></p>
    </header>
    <div class="crew" id="crew"></div>
    <p class="fact" id="fact"></p>
    <p class="dedi" id="dedi" hidden></p>
  </section>

  <section id="game" class="screen" hidden>
    <div class="gamebar">
      <button class="back" id="backBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Town</button>
      <div class="gtitle" id="gTitle"></div>
      <span class="pill" id="gCaps"></span>
    </div>
    <div class="bubble"><div class="face" id="gFace"></div><div class="say" id="gSay"></div></div>
    <div class="stats" id="stats"></div>
    <div id="stage"></div>
    <div id="controls"></div>
  </section>
</div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <div id="mFace"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div id="mExtra" style="width:100%"></div>
    <div class="mbtns" id="mBtns"></div>
  </div>
</div>

<script>
(() => {
'use strict';

// Put your own note here and it shows at the bottom of the town page.
const DEDICATION = '';

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const rnd = n => Math.floor(Math.random() * n);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stage = $('#stage'), controls = $('#controls'), statsEl = $('#stats');
const modalOpen = () => !$('#modal').hidden;

/* ---------- save data ---------- */
const KEY = 'trash-panda-town-v1';
const fresh = () => ({ name: '', caps: 0, helps: 0, muted: false, lv: { pop: 1, merge: 1, stack: 1, bingo: 1, sort: 1 }, merge: null, stackBest: 0 });
let S = fresh();
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- sound ---------- */
let AC;
function tone(f = 600, d = .08, type = 'sine', v = .07) {
  if (S.muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d + .02);
  } catch (e) {}
}
const sfx = {
  tap: () => tone(420, .05, 'triangle', .05),
  pop: (k = 0) => tone(520 + k * 90 + rnd(60), .09, 'triangle'),
  good: () => { tone(660, .1, 'triangle'); setTimeout(() => tone(880, .14, 'triangle'), 90); },
  bad: () => tone(170, .14, 'square', .03),
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .2, 'triangle', .08), i * 120)),
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- art ---------- */
const CAP = (() => {
  let p = '';
  for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2, r = i % 2 ? 10 : 12; p += (i ? 'L' : 'M') + (12 + r * Math.cos(a)).toFixed(2) + ' ' + (12 + r * Math.sin(a)).toFixed(2); }
  return `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="${p}Z" fill="#ffb547"/><circle cx="12" cy="12" r="7" fill="#ffd486"/><circle cx="12" cy="12" r="7" fill="none" stroke="#c9822a" stroke-width="1.2"/></svg>`;
})();
const CAPSM = CAP.replace('width="20" height="20"', 'width="14" height="14"');

/* =====================================================================
   Snack Pop (match three)
   ===================================================================== */
const Pop = (() => {
  const R = 8, C = 7, SNACKS = ['🍎', '🍩', '🧀', '🍕', '🍪', '🍇'];
  let grid, cell, board, els, busy, moves, goals, sel, start, nt, L, alive, idc = 0;
  const np = () => ({ id: ++idc, t: rnd(nt), sp: false });

  function mount() {
    alive = true; L = S.lv.pop; nt = L < 3 ? 5 : 6; busy = false; sel = null; start = null; els = new Map();
    const ng = L < 3 ? 1 : L < 6 ? 2 : 3;
    const types = shuffle([...Array(nt).keys()]).slice(0, ng);
    const per = ng === 1 ? Math.min(30, 12 + 3 * L) : ng === 2 ? Math.min(22, 8 + 2 * L) : Math.min(18, 8 + L);
    goals = types.map(t => ({ t, left: per }));
    moves = [20, 24, 28][ng - 1];
    say(`I tipped over the picnic basket! Help me gather ${goalText()}.`);
    controls.innerHTML = '<p class="hint">Swipe a snack onto its neighbour to line up three. Match four to make a sparkle snack that clears everything around it.</p>';
    board = h('div', 'pop-board'); stage.append(board);
    initGrid(); updateStats(); layout();
    board.addEventListener('pointerdown', down);
    board.addEventListener('pointermove', movep);
    board.addEventListener('pointerup', up);
    board.addEventListener('pointercancel', () => { start = null; });
  }
  function unmount() { alive = false; }
  function goalText() { const g = goals.map(g => `${g.left} ${SNACKS[g.t]}`); return g.length > 1 ? g.slice(0, -1).join(', ') + ' and ' + g[g.length - 1] : g[0]; }
  function updateStats() {
    setStats([{ html: `Moves <b>${moves}</b>` }, ...goals.map(g => ({ html: `<span class="e">${SNACKS[g.t]}</span>${g.left || '✓'}`, done: !g.left }))]);
  }
  function layout() {
    cell = Math.floor(Math.min(stage.clientWidth / C, stage.clientHeight / R, 64));
    board.style.width = C * cell + 'px'; board.style.height = R * cell + 'px';
    board.style.setProperty('--cell', cell + 'px');
    render();
  }
  function initGrid() {
    do {
      grid = Array.from({ length: R }, () => Array(C).fill(null));
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
        let p;
        do { p = np(); } while ((c >= 2 && grid[r][c - 1].t === p.t && grid[r][c - 2].t === p.t) || (r >= 2 && grid[r - 1][c].t === p.t && grid[r - 2][c].t === p.t));
        p.from = r - R; grid[r][c] = p;
      }
    } while (!hasMove());
  }
  function render() {
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const p = grid[r][c]; if (!p) continue;
      let el = els.get(p.id);
      if (!el) {
        el = h('div', 'pc', `<span>${SNACKS[p.t]}</span>`); board.append(el); els.set(p.id, el);
        el.style.transition = 'none';
        el.style.transform = `translate(${c * cell}px,${(p.from ?? r) * cell}px)`;
        void el.offsetWidth; el.style.transition = '';
        delete p.from;
      }
      el.style.transform = `translate(${c * cell}px,${r * cell}px)`;
      el.classList.toggle('sp', p.sp);
      el.classList.toggle('sel', !!sel && sel[0] === r && sel[1] === c);
    }
  }
  function rc(e) { const b = board.getBoundingClientRect(); return [Math.floor((e.clientY - b.top) / cell), Math.floor((e.clientX - b.left) / cell)]; }
  function down(e) {
    if (busy) return;
    const [r, c] = rc(e); if (r < 0 || r >= R || c < 0 || c >= C) return;
    start = { r, c, x: e.clientX, y: e.clientY };
    try { board.setPointerCapture(e.pointerId); } catch (_) {}
  }
  function movep(e) {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < cell * .4) return;
    const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
    const a = [start.r, start.c]; start = null;
    trySwap(a, [a[0] + dr, a[1] + dc]);
  }
  function up() {
    if (!start) return;
    const a = [start.r, start.c]; start = null;
    if (sel && Math.abs(sel[0] - a[0]) + Math.abs(sel[1] - a[1]) === 1) { const s = sel; trySwap(s, a); }
    else { sel = sel && sel[0] === a[0] && sel[1] === a[1] ? null : a; sfx.tap(); render(); }
  }
  function swap(a, b) { const t = grid[a[0]][a[1]]; grid[a[0]][a[1]] = grid[b[0]][b[1]]; grid[b[0]][b[1]] = t; }
  async function trySwap(a, b) {
    if (busy || b[0] < 0 || b[0] >= R || b[1] < 0 || b[1] >= C) return;
    busy = true; sel = null; swap(a, b); render(); await sleep(170); if (!alive) return;
    if (!findRuns(grid).length) { swap(a, b); render(); sfx.bad(); await sleep(170); busy = false; return; }
    moves--; updateStats();

    busy = false; checkEnd();
  }
  function findRuns(g) {
    const runs = [];
    for (let r = 0; r < R; r++) { let c = 0; while (c < C) { const t = g[r][c]?.t; let e = c + 1; while (t != null && e < C && g[r][e]?.t === t) e++; if (t != null && e - c >= 3) runs.push(Array.from({ length: e - c }, (_, i) => [r, c + i])); c = e; } }
    for (let c = 0; c < C; c++) { let r = 0; while (r < R) { const t = g[r][c]?.t; let e = r + 1; while (t != null && e < R && g[e][c]?.t === t) e++; if (t != null && e - r >= 3) runs.push(Array.from({ length: e - r }, (_, i) => [r + i, c])); r = e; } }
    return runs;
  }
  function hasMove() {
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const rr = r + dr, cc = c + dc; if (rr >= R || cc >= C) continue;
      swap([r, c], [rr, cc]); const ok = findRuns(grid).length > 0; swap([r, c], [rr, cc]);
      if (ok) return true;
    }
    return false;
  }
  async function resolve(swapCells) {
    let combo = 0;
    for (;;) {
      const runs = findRuns(grid); if (!runs.length) break;
      combo++;
      const clear = new Set(), keep = new Set();
      for (const run of runs) {
        run.forEach(([r, c]) => clear.add(r * C + c));
        if (run.length >= 4) {
          const pick = run.find(([r, c]) => swapCells && swapCells.some(s => s[0] === r && s[1] === c)) || run[run.length >> 1];
          const p = grid[pick[0]][pick[1]]; if (p && !p.sp) keep.add(pick[0] * C + pick[1]);
        }
      }
      const blown = new Set(); let more = true;
      while (more) {
        more = false;
        for (const k of [...clear]) {
          const r = Math.floor(k / C), c = k % C, p = grid[r][c];
          if (p && p.sp && !blown.has(k)) {
            blown.add(k);
            for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
              const rr = r + dr, cc = c + dc;
              if (rr >= 0 && rr < R && cc >= 0 && cc < C && !clear.has(rr * C + cc)) { clear.add(rr * C + cc); more = true; }
            }
          }
        }
      }
      for (const k of clear) {
        if (keep.has(k)) continue;
        const r = Math.floor(k / C), c = k % C, p = grid[r][c]; if (!p) continue;
        const g = goals.find(g => g.t === p.t); if (g && g.left) g.left--;
        const el = els.get(p.id); els.delete(p.id);
        if (el) { el.classList.add('gone'); setTimeout(() => el.remove(), 220); }
        grid[r][c] = null;
      }
      for (const k of keep) grid[Math.floor(k / C)][k % C].sp = true;
      sfx.pop(combo); if (blown.size) buzz(25);
      if (combo === 3) say('Ooh, a chain reaction! Keep going!');
      render(); updateStats();
      await sleep(210); if (!alive) return;
      gravity(); render();
      await sleep(270); if (!alive) return;
      swapCells = null;
    }
    if (!hasMove() && !goals.every(g => !g.left) && moves > 0) await reshuffle();
  }
  function gravity() {
    for (let c = 0; c < C; c++) {
      let w = R - 1;
      for (let r = R - 1; r >= 0; r--) if (grid[r][c]) { if (w !== r) { grid[w][c] = grid[r][c]; grid[r][c] = null; } w--; }
      const gap = w + 1;
      for (let r = w; r >= 0; r--) { const p = np(); p.from = r - gap; grid[r][c] = p; }
    }
  }
  async function reshuffle() {
    say('No moves left, so I gave the basket a good shake.');
    const ps = grid.flat(); let tries = 0;
    do {
      if (++tries > 200) { ps.forEach(p => { p.t = rnd(nt); p.sp = false; }); tries = 0; }

      else { b.textContent = card[r][c]; b.setAttribute('aria-label', String(card[r][c])); }
      b.onclick = () => tapCell(r, c, b);
      cells.push(b); cardEl.append(b);
    }
    wrap.append(caller, cardEl); stage.append(wrap);

    pawBtn = h('button', 'btn ghost'); pawBtn.onclick = toggleWild;
    bingoBtn = h('button', 'btn', 'BINGO!'); bingoBtn.onclick = claim;
    controls.append(pawBtn, bingoBtn);
    updateUI(); layout();
    const speed = Math.max(2300, 3400 - L * 150);
    startT = setTimeout(() => { callNext(); timer = setInterval(callNext, speed); }, 1100);
  }
  function unmount() { alive = false; clearTimeout(startT); clearInterval(timer); }
  function layout() {
    const H = stage.clientHeight - 78 - 12;
    const bc = Math.floor(Math.min((stage.clientWidth - 24 - 20) / 5, (H - 24 - 25) / 5.55, 66));
    cardEl.style.setProperty('--bc', bc + 'px');
  }
  function countLines() {
    const d = daub; let n = 0;
    for (let i = 0; i < 5; i++) { if (d[i].every(Boolean)) n++; if (d.every(row => row[i])) n++; }
    if ([0, 1, 2, 3, 4].every(i => d[i][i])) n++;
    if ([0, 1, 2, 3, 4].every(i => d[i][4 - i])) n++;
    if (d[0][0] && d[0][4] && d[4][0] && d[4][4]) n++;
    return n;
  }
  function updateUI() {
    const n = countLines();
    setStats([{ html: `Balls left <b>${maxBalls - called.length}</b>` }, { html: `Lines ${Math.min(n, need)}/${need}`, done: n >= need }]);
    pawBtn.innerHTML = `${PAW.replace('<svg ', '<svg width="20" height="20" ')} Lucky paw ×${wilds}`;
    pawBtn.disabled = !wilds || ended;
    pawBtn.classList.toggle('on', wildMode);
    bingoBtn.classList.toggle('ready', n >= need);
  }
  function callNext() {
    if (!alive || ended || modalOpen()) return;
    if (called.length >= maxBalls) return outOfBalls();
    cells.forEach((b, i) => { const r = Math.floor(i / 5), c = i % 5; if (!daub[r][c] && called.includes(card[r][c])) b.classList.add('miss'); });
    const n = pool.pop(); called.push(n);
    const letter = 'BINGO'[Math.floor((n - 1) / 15)];
    ballEl.innerHTML = `<small>${letter}</small>${n}`;
    ballEl.classList.remove('in'); void ballEl.offsetWidth; ballEl.classList.add('in');
    histEl.innerHTML = called.slice(-5, -1).reverse().map(v => `<span>${v}</span>`).join('');
    say(LINGO[n] ? `${letter} ${n}, ${LINGO[n]}!` : `${letter} ${n}. That's ${letter}, ${n}.`);
    tone(740, .12, 'sine', .06);
    updateUI();
  }
  function tapCell(r, c, b) {
    if (ended || daub[r][c]) return;
    const n = card[r][c], isCalled = called.includes(n);
    if (wildMode || isCalled) {
      if (wildMode && !isCalled) wilds--;
      wildMode = false; daub[r][c] = true;
      b.classList.remove('miss'); b.insertAdjacentHTML('beforeend', PAW);
      sfx.pop(); buzz(10);
      if (countLines() >= need) say('Oh my whiskers, you have it! Shout BINGO!');
    } else { sfx.bad(); shakeEl(b); say(`${n} hasn't been called yet, dear.`); }
    updateUI();
  }
  function toggleWild() {
    if (!wilds || ended) return;
    wildMode = !wildMode; sfx.tap();
    if (wildMode) say('Lucky paw ready. Tap any square to stamp it.');
    updateUI();
  }
  function claim() {
    if (ended) return;
    if (countLines() >= need) return doWin();
    sfx.bad(); shakeEl(bingoBtn);
    say(`Not quite yet. You need ${need} line${need > 1 ? 's' : ''}.`);
  }
  function doWin() {
    ended = true; clearInterval(timer); updateUI();
    const left = maxBalls - called.length; S.lv.bingo++;
    win('bingo', 12 + left + L * 2, 'BINGO!', `Grandma Maple is dancing on the bin lids. You won with ${left} ball${left === 1 ? '' : 's'} to spare.`);
  }
  function outOfBalls() {
    if (countLines() >= need) return doWin();
    ended = true; clearInterval(timer); updateUI();
    lose('bingo', 'Out of moon balls', 'That was the last ball in the hat. Grandma Maple says the next card is a lucky one.');
  }
  return { mount, unmount, layout };
})();

/* =====================================================================
   Shiny Sort (jar sort)
   ===================================================================== */
const Sort = (() => {
  const TR = [['🔑', '#ffb547'], ['🐚', '#ff7096'], ['💍', '#79e2c0'], ['🔔', '#6fa8ff'], ['🍬', '#b994ff'], ['🧷', '#a6e36b'], ['⭐', '#ff8a4c'], ['🎀', '#fff3d6']];
  let jars, n, hist, sel, extra, startJars, wrapEl, alive, L, movesN, undoBtn, extraBtn;
  const done = j => j.length === 4 && j.every(v => v === j[0]);
  const runLen = j => { if (!j.length) return 0; let k = 1; while (k < j.length && j[j.length - 1 - k] === j[j.length - 1]) k++; return k; };

  function mount() {
    alive = true; L = S.lv.sort; n = Math.min(8, 2 + Math.ceil(L / 1.5)); hist = []; sel = -1; extra = false; movesN = 0;
    let ok = false;
    while (!ok) {
      const items = shuffle([...Array(n)].flatMap((_, i) => [i, i, i, i]));
      jars = []; for (let i = 0; i < n; i++) jars.push(items.slice(i * 4, i * 4 + 4));
      ok = jars.every(j => !done(j));
    }
    jars.push([], []);
    startJars = JSON.stringify(jars);
    say('Someone jumbled my shiny stash! Put four of a kind in every jar.');
    undoBtn = h('button', 'btn ghost', 'Undo'); undoBtn.onclick = undo;
    const restart = h('button', 'btn ghost', 'Restart'); restart.onclick = () => { jars = JSON.parse(startJars); hist = []; sel = -1; extra = false; movesN = 0; layout(); stats(); sfx.tap(); };
    extraBtn = h('button', 'btn', '+ Extra jar'); extraBtn.onclick = addJar;
    controls.append(undoBtn, restart, extraBtn);
    wrapEl = h('div', 'jars'); stage.append(wrapEl);
    layout(); stats();
  }
  function unmount() { alive = false; }
  function layout() {
    const cnt = jars.length, rows = cnt <= 5 ? 1 : 2, per = Math.ceil(cnt / rows), gx = 12, gy = 22;
    let jw = Math.min(72, Math.floor((stage.clientWidth - (per - 1) * gx) / per));
    const maxIt = Math.floor(((stage.clientHeight - 20 - (rows - 1) * gy) / rows - 44) / 4);
    const it = Math.max(18, Math.min(jw - 14, maxIt)); jw = it + 14;
    wrapEl.style.setProperty('--it', it + 'px'); wrapEl.style.setProperty('--jw', jw + 'px');
    wrapEl.style.maxWidth = (per * jw + (per - 1) * gx + 2) + 'px';
    render();
  }
  function stats() {
    setStats([{ html: `Moves <b>${movesN}</b>` }, { html: `Jars sorted ${jars.filter(done).length}/${n}`, done: jars.filter(done).length === n }]);
    undoBtn.disabled = !hist.length; extraBtn.disabled = extra;
  }
  function render() {
    wrapEl.innerHTML = '';
    jars.forEach((j, i) => {
      const b = h('button', 'jar' + (done(j) ? ' done' : '') + (i === sel ? ' sel' : ''));
      b.setAttribute('aria-label', `Jar ${i + 1}, ${j.length} of 4 full`);
      const up = i === sel ? runLen(j) : 0;
      b.innerHTML = `<div class="lid"></div><div class="glass">${j.map((v, k) => `<span class="tr${k >= j.length - up ? ' up' : ''}" style="background:${TR[v][1]}">${TR[v][0]}</span>`).join('')}</div>`;
      b.onclick = () => tap(i, b);
      wrapEl.append(b);
    });
  }
  function tap(i, b) {
    if (modalOpen()) return;
    if (sel < 0) {
      if (!jars[i].length || done(jars[i])) { shakeEl(b); return; }
      sel = i; sfx.tap(); render(); return;
    }
    if (sel === i) { sel = -1; render(); return; }
    const A = jars[sel], B = jars[i], top = A[A.length - 1];
    if (B.length >= 4 || (B.length && B[B.length - 1] !== top)) {
      sfx.bad();
      sel = B.length && !done(B) ? i : -1;
      render(); shakeEl(wrapEl.children[i]); return;
    }
    hist.push(JSON.stringify(jars));
    let k = Math.min(runLen(A), 4 - B.length);
    while (k--) B.push(A.pop());
    sel = -1; movesN++;
    if (done(B)) { sfx.good(); buzz(20); } else sfx.pop();
    render(); stats();
    if (jars.every(j => !j.length || done(j))) {
      S.lv.sort++;
      setTimeout(() => alive && win('sort', 8 + n * 2 + (extra ? 0 : 5), 'Stash sorted!', `Every jar holds four of a kind and Juniper can finally find her favourite key. Done in ${movesN} moves.`), 350);
    }
  }
  function undo() { if (!hist.length) return; jars = JSON.parse(hist.pop()); sel = -1; movesN++; sfx.tap(); render(); stats(); }
  function addJar() { if (extra) return; extra = true; jars.push([]); sel = -1; say('Here, borrow my spare jar.'); layout(); stats(); sfx.good(); }
  return { mount, unmount, layout };
})();

const GAMES = { pop: Pop, merge: Kitchen, stack: Stack, bingo: Bingo, sort: Sort };

/* ---------- boot ---------- */
let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (cur && cur.layout) cur.layout(); }, 150); });
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}

function boot(data) {
  const saved = (data && data.S) || load();
  S = Object.assign(fresh(), saved || {});
  S.lv = Object.assign(fresh().lv, (saved && saved.lv) || {});
  makeStars(); renderHub();
  if (!S.name) askName();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
