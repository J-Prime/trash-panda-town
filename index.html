<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Trash Panda Town</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1b1836">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trash Pandas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
:root{
  /* Layout: one phone-width column. Town = glowing sign, string lights, a stack of neighbour rows.
     Each game = raccoon speech bubble on top, board in the middle, thumb controls at the bottom. */
  --night:#1b1836; --dusk:#27234d; --alley:#373166; --line:#433d7a;
  --lamp:#ffb547; --lamp-deep:#b8701c; --moon:#fff3d6; --muted:#bdb6de;
  --mint:#79e2c0; --berry:#ff7096; --bin:#3f7a62; --bin2:#2a5444; --ink:#2a2640;
  /* surfaces that the region theme swaps */
  --glow:#2e2963; --hover:#5b54a0; --deep:#15122c; --sky:#151230; --well:#1f1c40; --tile:#2b2755;
  --check1:#2c2857; --check2:#242046; --picked:#3b3672; --hid:#3a3566; --hidline:#4f4890;
  --vip:#3a2f4f; --ready:#24394f; --miss:#8f88b8; --missink:#4a4470; --lid:#7d78a8; --scrim:rgba(14,12,32,.76);
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--night);transition:background-color 1.2s}
body{height:100%;margin:0;background:var(--night) radial-gradient(120% 55% at 50% 0%,var(--glow) 0%,var(--night) 72%) no-repeat;color:var(--moon);font-family:var(--body);font-size:16px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------- Town ---------- */
.hub{overflow-y:auto;padding-block:12px 28px;gap:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hubtop{position:relative;padding-top:2px}
.stars{position:absolute;inset:0;pointer-events:none}
.stars span{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--moon);animation:tw 2.6s ease-in-out infinite alternate}
.moon{position:absolute;right:4px;top:78px;width:84px;height:84px;border-radius:50%;
  background:radial-gradient(circle at 30% 36%,rgba(42,38,64,.10) 0 9px,transparent 10px),radial-gradient(circle at 62% 62%,rgba(42,38,64,.08) 0 13px,transparent 14px),radial-gradient(circle at 70% 27%,rgba(42,38,64,.07) 0 6px,transparent 7px),var(--moon);
  box-shadow:0 0 40px rgba(255,243,214,.35),0 0 120px rgba(255,243,214,.14)}
.toprow{position:relative;display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--dusk);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 6px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--dusk);border:2px solid var(--line);display:grid;place-items:center;padding:0}
.lights{position:relative;margin-top:6px}
.lights svg{width:100%;height:auto;display:block}
.bulb.new{animation:flick 1.2s ease-out 1}
h1{position:relative;font-family:var(--display);font-weight:400;font-size:clamp(42px,12.5vw,58px);line-height:.9;margin:4px 0 10px;color:var(--lamp);text-shadow:0 4px 0 #7a4512,0 0 30px rgba(255,181,71,.45);text-wrap:balance}
.greet{position:relative;margin:0;font-size:17px;line-height:1.35;max-width:30ch}
.namebtn{background:none;border:none;padding:0;color:var(--lamp);font-weight:800;text-decoration:underline dotted;text-underline-offset:4px}
.lightnote{position:relative;margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.crew{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 14px 10px 8px;background:var(--dusk);border:2px solid var(--line);border-radius:22px;text-align:left;transition:transform .12s,border-color .12s}
.row:hover{border-color:var(--hover)}
.row:active{transform:scale(.98)}
.row .who{display:flex;flex-direction:column;min-width:0}
.row .game{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp)}
.row h3{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.05;margin:1px 0 0}
.row p{margin:3px 0 0;font-size:14px;line-height:1.3;color:var(--muted)}
.lv{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lv b{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:0;color:var(--moon);line-height:1.05}
.fact{margin:2px 0 0;padding:12px 14px;border-radius:18px;border:2px dashed var(--line);font-size:14px;line-height:1.4;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.fact svg{flex:none;color:var(--lamp);margin-top:2px}
.fact b{color:var(--moon);display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.dedi{margin:0;text-align:center;font-size:14px;color:var(--muted)}

/* ---------- Game shell ---------- */
.gamebar{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.back{background:var(--dusk);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 10px;font-weight:800;display:inline-flex;align-items:center;gap:2px}
.gtitle{flex:1;min-width:0;font-family:var(--display);font-size:20px;line-height:1.05}
.gtitle small{display:block;font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp)}
.bubble{display:flex;align-items:center;gap:8px;min-height:78px}
.bubble .face{flex:none}
.say{position:relative;flex:1;background:var(--moon);color:var(--ink);border-radius:18px;padding:8px 12px;font-size:15px;line-height:1.3;font-weight:600}
.say::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:var(--moon);border-left:0}
.say b{font-weight:800}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-block:8px;min-height:48px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--dusk);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.done{border-color:var(--mint);color:var(--mint)}
.chip .e{font-size:18px;line-height:1}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
#controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;padding-block:10px 16px;min-height:24px}
.hint{margin:0;text-align:center;font-size:13.5px;line-height:1.35;color:var(--muted);max-width:38ch}
.btn{font-family:var(--display);font-weight:400;font-size:18px;border:none;border-radius:16px;padding:11px 18px;background:var(--lamp);color:#3a2208;box-shadow:0 4px 0 var(--lamp-deep);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--lamp-deep)}
.btn.ghost{background:var(--alley);color:var(--moon);box-shadow:0 4px 0 var(--deep)}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--deep)}
.btn.ghost.on{background:var(--berry);color:var(--ink);box-shadow:0 4px 0 #a8395a}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{font-size:14px;padding:5px 9px;border-radius:11px;box-shadow:0 3px 0 var(--lamp-deep)}
.shake{animation:shake .32s}

/* ---------- Snack Pop ---------- */
.pop-board{position:relative;border-radius:18px;overflow:hidden;touch-action:none;
  background:repeating-conic-gradient(var(--check1) 0 25%,var(--check2) 0 50%) 0 0/calc(var(--cell)*2) calc(var(--cell)*2);
  box-shadow:0 0 0 3px var(--line),0 14px 30px rgba(0,0,0,.35)}
.pc{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);display:grid;place-items:center;font-size:calc(var(--cell)*.62);line-height:1;transition:transform .24s cubic-bezier(.34,1.3,.64,1)}
.pc span{display:block;transition:transform .2s,opacity .2s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.28))}
.pc.sel{z-index:2}
.pc.sel span{transform:scale(1.2)}
.pc.sel::before{content:"";position:absolute;inset:3px;border-radius:14px;background:rgba(255,243,214,.15);box-shadow:inset 0 0 0 2px var(--moon)}
.pc.sp::after{content:"";position:absolute;inset:2px;border-radius:50%;border:3px dotted var(--lamp);animation:spin 4s linear infinite}
.pc.gone span{transform:scale(1.6);opacity:0}

/* ---------- Midnight Kitchen ---------- */
.mg-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.mg-orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.order{background:var(--dusk);border:2px solid var(--line);border-radius:18px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.order.ready{border-color:var(--mint);background:var(--ready)}
.oname{font-size:13px;font-weight:800;line-height:1.1}
.wants{display:flex;gap:2px;font-size:25px;line-height:1.2}
.mg-board{display:grid;grid-template-columns:repeat(6,var(--cell));grid-auto-rows:var(--cell);gap:5px;touch-action:none}
.mc{position:relative;border-radius:12px;background:var(--tile);display:grid;place-items:center;font-size:calc(var(--cell)*.6);line-height:1}
.mc span{display:block}
.mc i{position:absolute;right:4px;bottom:1px;font-style:normal;font-size:11px;font-weight:800;color:var(--muted)}
.mc.gen{background:var(--alley);box-shadow:inset 0 0 0 2px var(--lamp)}
.mc.want{box-shadow:inset 0 0 0 2px var(--mint)}
.mc.lifted span{opacity:.25}
.mc.merged span{animation:boing .42s}
.mc.spawn span{animation:drop .32s}
.drag-ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}

/* ---------- Bin Stacker ---------- */
.st-cv{display:block;border-radius:8px;box-shadow:0 0 0 4px var(--bin),0 0 0 7px var(--bin2),0 14px 30px rgba(0,0,0,.35);touch-action:none}
.pad{display:flex;gap:8px;justify-content:center;width:100%}
.pad button{flex:1;max-width:66px;height:54px;border-radius:16px;border:none;background:var(--alley);box-shadow:0 4px 0 var(--deep);display:grid;place-items:center;color:var(--moon);touch-action:none;padding:0}
.pad button.hot{background:var(--lamp);color:#3a2208;box-shadow:0 4px 0 var(--lamp-deep)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.pad button.hot:active{box-shadow:0 1px 0 var(--lamp-deep)}

/* ---------- Moon Bingo ---------- */
.bg-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.caller{display:flex;align-items:center;gap:12px;justify-content:center;height:78px}
.ball{width:76px;height:76px;flex:none;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fffdf6 0 14%,var(--moon) 15% 62%,#e9d29d 100%);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;line-height:.9;box-shadow:0 0 34px rgba(255,243,214,.42);font-variant-numeric:tabular-nums}
.ball small{font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:.12em}
.ball.in{animation:roll .5s cubic-bezier(.3,1.4,.6,1)}
.hist{display:flex;gap:6px}
.hist span{width:34px;height:34px;border-radius:50%;background:var(--alley);display:grid;place-items:center;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.card{display:grid;grid-template-columns:repeat(5,var(--bc));gap:5px;padding:10px;background:var(--dusk);border:2px solid var(--line);border-radius:20px}
.card .hd{font-family:var(--display);font-size:calc(var(--bc)*.48);color:var(--lamp);text-align:center;line-height:1.15}
.bcell{position:relative;height:var(--bc);border:none;border-radius:12px;background:var(--moon);color:var(--ink);font-weight:800;font-size:calc(var(--bc)*.4);display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.bcell svg{position:absolute;left:8%;top:8%;width:84%;height:84%;color:var(--berry);opacity:.88;animation:stamp .26s}
.bcell.free{background:var(--lamp);font-size:calc(var(--bc)*.2);letter-spacing:.08em;align-items:end;padding-bottom:2px}
.bcell.free svg{color:var(--ink);opacity:.35;animation:none}
.bcell.miss{box-shadow:0 0 0 3px var(--mint);animation:pulse 1.2s ease-in-out infinite}
.btn.ready{background:var(--mint);box-shadow:0 4px 0 #3c9a7c;animation:pulse 1s ease-in-out infinite}

/* ---------- Shiny Sort ---------- */
.jars{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 12px;padding-top:16px}
.jar{width:var(--jw);display:flex;flex-direction:column;align-items:center;background:none;border:none;padding:0;transition:transform .18s}
.jar .lid{width:78%;height:10px;margin-bottom:2px;border-radius:6px 6px 2px 2px;background:var(--lid)}
.jar .glass{width:100%;height:calc(var(--it)*4 + 30px);border-radius:10px 10px 22px 22px;background:rgba(255,243,214,.07);border:3px solid rgba(255,243,214,.32);display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:3px;padding:8px 0 6px}
.jar.sel{transform:translateY(-14px)}
.jar.sel .glass{border-color:var(--lamp)}
.jar.done .glass{border-color:var(--mint);box-shadow:0 0 18px rgba(121,226,192,.35)}
.jar.done .lid{background:var(--mint)}
.tr{width:var(--it);height:var(--it);flex:none;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--it)*.58);line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .15s}
.tr.up{transform:translateY(-6px)}

/* ---------- Modal, toast ---------- */
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:340px;background:var(--dusk);border:2px solid var(--line);border-radius:28px;padding:20px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;animation:rise .38s cubic-bezier(.3,1.3,.6,1)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:0;color:var(--lamp);text-wrap:balance}
.sheet p{margin:0;line-height:1.4;max-width:30ch}
.reward{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:24px;color:var(--lamp)}
.mbtns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px}
#nameInput{width:100%;font:inherit;font-size:18px;font-weight:700;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--night);color:var(--moon);text-align:center;-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:55;background:var(--moon);color:var(--ink);padding:9px 16px;border-radius:18px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .3s,transform .3s;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.out{opacity:0;transform:translate(-50%,10px)}

@keyframes tw{from{opacity:.2}to{opacity:.85}}
@keyframes flick{0%,24%,48%{opacity:.15}12%,36%,100%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes boing{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes drop{0%{transform:translateY(-14px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes roll{0%{transform:translateX(-60px) rotate(-200deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes stamp{0%{transform:scale(1.8);opacity:0}100%{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes rise{0%{transform:translateY(40px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* =====================================================================
   v2 additions: town scene, projects, stars, boosters and harder games.
   ===================================================================== */
.pills{display:flex;gap:8px}
.pill svg{flex:none}
h1{font-size:clamp(36px,10.5vw,50px);margin:6px 0 6px}
.iconbtn.sm{width:34px;height:34px;flex:none}
.lv em{display:inline-flex;align-items:center;gap:3px;font-style:normal;font-size:12px;color:var(--lamp);letter-spacing:0}

/* town scene */
.scene{border-radius:22px;overflow:hidden;border:2px solid var(--line);background:var(--sky);line-height:0;flex:none}
.scene svg{width:100%;height:auto;display:block}
.pj.new{animation:built 1.1s cubic-bezier(.3,1.4,.6,1) both;transform-box:fill-box;transform-origin:50% 100%}
.tw{animation:tw 1.8s ease-in-out infinite alternate}
.tw:nth-of-type(2n){animation-delay:.6s}
.tw:nth-of-type(3n){animation-delay:1.1s}
.buzz{animation:neon 4s linear infinite}
.flame{animation:flame .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}

/* next project card */
.project{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding:12px 14px 14px 10px;background:var(--dusk);border:2px solid var(--lamp);border-radius:22px;box-shadow:0 0 24px rgba(255,181,71,.14);flex:none}
.pface{padding-top:4px}
.pbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp)}
.pbody h3{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.05;margin:0}
.pbody p{margin:0;font-size:14px;line-height:1.35;color:var(--muted)}
.pbar{position:relative;height:24px;border-radius:999px;background:var(--night);border:2px solid var(--line);overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--lamp-deep),var(--lamp));border-radius:999px;transition:width .6s}
.pbar span{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;height:100%;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--moon);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pbody .btn{align-self:flex-start;margin-top:2px}

/* modal results */
.starrow{display:flex;gap:6px;justify-content:center;align-items:flex-end;margin:2px 0}
.starrow span{animation:starpop .45s cubic-bezier(.3,1.6,.6,1) both}
.starrow span:nth-child(2){transform:translateY(-8px)}
.starrow span:nth-child(2) svg{width:56px;height:56px}
.starrow span:not(.on){animation-name:fadein}
.mnote{font-size:13.5px;color:var(--muted)}
.bnote{margin:-6px 0 0;font-size:12.5px;color:var(--berry)}
.tut{margin:0;padding:0 0 0 22px;text-align:left;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.4;max-width:32ch}
.tut li::marker{color:var(--lamp);font-weight:800}
.sheet{max-height:100%;overflow-y:auto}
.chip.warn{border-color:var(--berry);color:var(--berry)}

/* ---------- Snack Pop ---------- */
.jm{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);pointer-events:none}
.jm.j1::before,.jm.j2::before{content:"";position:absolute;inset:2px;border-radius:30%;background:rgba(255,112,150,.38)}
.jm.j2::before{background:rgba(255,112,150,.66);box-shadow:inset 0 0 0 3px rgba(255,190,210,.55)}

  if (has('lights')) {

    for (let x = 0; x <= 360; x += 10) { const t = (x % 180) / 180; w += ` L${x} ${(56 + 12 * Math.sin(t * Math.PI)).toFixed(1)}`; }
    for (let x = 10, i = 0; x < 360; x += 20, i++) { const y = 56 + 12 * Math.sin(((x % 180) / 180) * Math.PI) + 5; b += `<circle cx="${x}" cy="${y.toFixed(1)}" r="3.4" fill="${['#ffb547', '#79e2c0', '#ff7096', '#fff3d6'][i % 4]}" class="tw" style="animation-delay:${(i % 5) * .4}s"/>`; }
    s += `<g class="${cls('lights')}"><path d="${w}" fill="none" stroke="#5a5486" stroke-width="1.5"/>${b}</g>`;
  }

  if (has('lamp')) s += `<g class="${cls('lamp')}"><ellipse cx="136" cy="160" rx="70" ry="78" fill="url(#lampglow)"/><rect x="120" y="70" width="4" height="117" fill="#5a5486"/><path d="M122 73 Q122 62 134 62" fill="none" stroke="#5a5486" stroke-width="4"/><path d="M128 61h14l-3 6h-8z" fill="#5a5486"/><ellipse cx="135" cy="68.5" rx="4" ry="2.4" fill="#ffd486"/></g>`;
  if (has('herbs')) s += `<g class="${cls('herbs')}">${[196, 207, 218].map((x, i) => `<circle cx="${x}" cy="168" r="5.5" fill="${['#5fbf7f', '#79e2c0', '#93d46c'][i]}"/><circle cx="${x - 3}" cy="164" r="3.5" fill="${['#4aa86a', '#5fcca8', '#7cc05a'][i]}"/><path d="M${x - 5} 172h10l-1.5 15h-7z" fill="#c46a4a" stroke="${ink}" stroke-width="1.5"/>`).join('')}</g>`;
  if (has('sofa')) s += `<g class="${cls('sofa')}"><rect x="228" y="144" width="60" height="14" rx="2" fill="#9c6a3a" stroke="${ink}" stroke-width="2"/><rect x="228" y="162" width="29" height="25" rx="2" fill="#a8743f" stroke="${ink}" stroke-width="2"/><rect x="259" y="162" width="29" height="25" rx="2" fill="#a8743f" stroke="${ink}" stroke-width="2"/><path d="M232 170h21M232 178h21M263 170h21M263 178h21" stroke="#7d5129" stroke-width="1.5"/><rect x="226" y="154" width="64" height="10" rx="5" fill="#ff7096" stroke="${ink}" stroke-width="2"/></g>`;
  if (has('cart')) s += `<g class="${cls('cart')}"><rect x="298" y="150" width="54" height="34" rx="3" fill="#e0b25b" stroke="${ink}" stroke-width="2"/><rect x="301" y="136" width="3" height="16" fill="#5a5486"/><rect x="346" y="136" width="3" height="16" fill="#5a5486"/><path d="M294 128h62v8q-3.9 6-7.8 0-3.9 6-7.8 0-3.9 6-7.8 0-3.9 6-7.8 0-3.9 6-7.8 0-3.9 6-7.8 0-3.9 6-7.8 0-3.9 6-7.8 0z" fill="#ff7096" stroke="${ink}" stroke-width="2"/><path d="M302 128v8M318 128v8M334 128v8M350 128v8" stroke="#fff3d6" stroke-width="5"/><circle cx="308" cy="187" r="5" fill="${ink}"/><circle cx="342" cy="187" r="5" fill="${ink}"/><text x="325" y="171" text-anchor="middle" font-size="13">🍔</text></g>`;
  s += coonSVG(CREW.stack.fur, 'bandana', 46, 36, 100);
  s += `<path d="M10 136 L108 136 L104 145 L14 145Z" fill="${painted ? '#4fb88b' : '#7d6857'}" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M14 144 L104 144 L99 187 L19 187Z" fill="${painted ? '#3f9a74' : '#6d5a4c'}" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>`;
  s += painted ? `<g class="${cls('paint')}"><path d="M20 154h78" stroke="#79e2c0" stroke-width="4"/><g transform="translate(47 158) scale(.6)" fill="#fff3d6">${PAW.replace(/<\/?svg[^>]*>/g, '')}</g></g>`
    : `<circle cx="32" cy="160" r="5" fill="#9a5b3a" opacity=".8"/><circle cx="76" cy="172" r="7" fill="#9a5b3a" opacity=".7"/><circle cx="88" cy="152" r="3" fill="#9a5b3a" opacity=".8"/>`;
  s += `<circle cx="26" cy="189" r="4" fill="${ink}"/><circle cx="92" cy="189" r="4" fill="${ink}"/>`;
  if (has('pond')) s += `<g class="${cls('pond')}"><ellipse cx="62" cy="211" rx="40" ry="11" fill="#6fa8ff" stroke="#b9d6ff" stroke-width="3"/><ellipse cx="54" cy="209" rx="12" ry="3" fill="#b9d6ff" opacity=".6"/><ellipse cx="78" cy="208" rx="6" ry="4" fill="#ffd23f"/><circle cx="82" cy="203" r="3.4" fill="#ffd23f"/><path d="M85 203l3 1-3 1z" fill="#ff9a5c"/></g>`;
  if (has('fire')) s += `<g class="${cls('fire')}"><ellipse cx="206" cy="200" rx="56" ry="34" fill="url(#fireglow)"/><ellipse cx="206" cy="216" rx="20" ry="6" fill="#5a5486" stroke="${ink}" stroke-width="2"/><g class="flame"><path d="M196 214 Q194 200 202 192 Q202 202 207 204 Q206 194 213 188 Q214 202 216 214Z" fill="#ff9a5c"/><path d="M201 214 Q201 205 206 200 Q207 207 211 214Z" fill="#ffd23f"/></g></g>`;
  const pos = { pop: [98, 172], sort: [148, 160], bingo: has('sofa') ? [236, 116] : [236, 168], merge: has('cart') ? [300, 160] : [306, 166] };
  for (const k of ['pop', 'sort', 'bingo', 'merge']) s += coonSVG(CREW[k].fur, CREW[k].acc, 42, ...pos[k]);
  if (!has('lamp')) s += `<rect width="360" height="230" fill="#0b0a1c" opacity=".38"/>`;
  return s + '</svg>';
}


/* ---------- game shell ---------- */
// mounted stays false while a first-time tutorial is still showing over an unmounted game.
let cur = null, curKey = null, freshBuild = null, mounted = false;

function say(t) { $('#gSay').innerHTML = `<b>${CREW[curKey].short}:</b> ${t}`; }
function setStats(chips) { statsEl.innerHTML = chips.map(c => `<span class="chip${c.done ? ' done' : ''}${c.warn ? ' warn' : ''}">${c.html ?? c}</span>`).join(''); }
function updateCaps() {
  $('#gCaps').innerHTML = CAP + S.caps; $('#hubCaps').innerHTML = CAP + S.caps; $('#hubStars').innerHTML = STAR(18) + S.stars;
}
function setTitle(sub) { $('#gTitle').innerHTML = `<small>${sub || `Level ${S.lv[curKey]}`}</small>${CREW[curKey].game}`; }
function shakeEl(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function toast(t) { const e = h('div', 'toast', t); document.body.append(e); setTimeout(() => e.classList.add('out'), 1800); setTimeout(() => e.remove(), 2200); }

function showModal({ k, title, text = '', html = '', buttons }) {
  $('#mFace').innerHTML = coon(k, 84);
  $('#mTitle').textContent = title;
  $('#mText').innerHTML = text;
  $('#mText').hidden = !text;
  $('#mExtra').innerHTML = html;
  const bb = $('#mBtns'); bb.innerHTML = '';
  buttons.forEach(b => {
    const e = h('button', 'btn' + (b.primary ? '' : ' ghost'), b.label);
    e.disabled = !!b.disabled; e.onclick = b.fn; bb.append(e);
    if (b.note) bb.append(h('p', 'bnote', b.note));
  });
  $('#modal').hidden = false;
  setTimeout(() => ($('#nameInput') || bb.querySelector('button:not(:disabled)'))?.focus(), 60);
}
function hideModal() { $('#modal').hidden = true; }

const starRow = n => `<div class="starrow">${[0, 1, 2].map(i => `<span class="${i < n ? 'on' : ''}" style="animation-delay:${.25 + i * .28}s">${STAR(46, i < n)}</span>`).join('')}</div>`;
const rewardHTML = caps => `<div class="reward">+ ${CAP.replace(/"20"/g, '"26"')} ${caps}</div>`;

function projectNote() {
  const p = nextProject();
  if (!p) return mapNews() ? '<p class="mnote">A new place has appeared on the map.</p>' : S.stars >= PARTY_COST ? `<p class="mnote">You have enough ★ for a ${region().party.name.toLowerCase()}.</p>` : '';
  return S.stars >= p.cost ? `<p class="mnote">You have enough ★ to build the <b>${p.name.toLowerCase()}</b>!</p>`
    : `<p class="mnote">${S.stars} of ${p.cost} ★ saved for the ${p.name.toLowerCase()}.</p>`;
}

// stars: 1-3 earned this level. The level always moves on, so stars are banked straight away.
function win(k, { stars, caps, title, text, nextLabel }) {
  stars = Math.max(1, Math.min(3, stars));
  const L = S.lv[k];
  S.best[k] = S.best[k] || {}; S.best[k][L] = stars;
  S.lv[k] = L + 1; S.helps++; S.stars += stars; S.totalStars += stars; S.got[k] = (S.got[k] || 0) + stars; S.caps += caps;
  save(); updateCaps(); sfx.win(); buzz([20, 40, 20]);
  for (let i = 0; i < stars; i++) setTimeout(() => sfx.star(i), 350 + i * 280);
  showModal({ k, title, text, html: starRow(stars) + rewardHTML(caps) + projectNote(), buttons: [
    { label: nextLabel || `Level ${L + 1}`, primary: true, fn: () => { hideModal(); openGame(k); } },
    { label: 'Back to town', fn: closeGame },
  ] });
}

// cont: {label, cost, fn} — a paid second chance that keeps the current board.
function lose(k, { title, text, cont }) {
  sfx.bad(); buzz([30, 30, 30]);
  const buttons = [];
  if (cont) buttons.push({ label: `${cont.label} · ${CAPSM} ${cont.cost}`, primary: true, disabled: S.caps < cont.cost,
    note: S.caps < cont.cost ? `You have ${S.caps} caps.` : '',
    fn: () => { if (!spend(cont.cost)) return; hideModal(); cont.fn(); } });
  buttons.push({ label: 'Try again', primary: !cont, fn: () => { hideModal(); openGame(k); } });
  buttons.push({ label: 'Back to town', fn: closeGame });
  showModal({ k, title, text, buttons });
}

function openGame(k) {
  if (mounted && cur.unmount) cur.unmount();
  curKey = k; cur = GAMES[k]; mounted = false;
  $('#hub').hidden = true; $('#game').hidden = false;
  $('#gFace').innerHTML = coon(k, 56);
  stage.innerHTML = ''; controls.innerHTML = ''; statsEl.innerHTML = ''; $('#gSay').innerHTML = '';
  setTitle(); updateCaps();
  // Games measure the stage while mounting; measure again once the stats and speech bubble have settled.
  const start = () => { if (!cur || curKey !== k) return; cur.mount(); mounted = true; requestAnimationFrame(() => { if (curKey === k && mounted && cur.layout) cur.layout(); }); };
  if (!S.tut[k]) showTut(k, start);
  else start();
}
function closeGame() {
  if (mounted && cur.unmount) cur.unmount();
  cur = null; curKey = null; mounted = false; hideModal();
  stage.innerHTML = ''; controls.innerHTML = '';
  $('#game').hidden = true; $('#hub').hidden = false;
  renderHub();
}
$('#backBtn').onclick = closeGame;
$('#helpBtn').innerHTML = icon('help', 20);
$('#helpBtn').onclick = () => { if (curKey && !modalOpen()) { sfx.tap(); showTut(curKey); } };

/* ---------- town ---------- */
function renderHub() {
  updateCaps();
  $('#muteBtn').innerHTML = icon(S.muted ? 'mute' : 'sound', 20);
  $('#mapBtn').classList.toggle('new', mapNews());
  const R = region();
  $('#townName').textContent = R.name;
  $('#greet').innerHTML = `Evening, <button class="namebtn" id="nameBtn">${esc(S.name || 'friend')}</button>. ` +
    (S.helps ? `You've helped ${plural(S.helps, 'time')} and earned ${S.totalStars} ★.` : R.greet);
  $('#nameBtn').onclick = askName;
  renderScene();
  freshBuild = null;
  renderProject();
  const crew = $('#crew'); crew.innerHTML = '';
  ORDER.forEach(k => {
    const c = CREW[k];
    const b = h('button', 'row');
    b.innerHTML = `${coon(k, 60)}<span class="who"><span class="game">${c.game}</span><h3>${c.name}</h3><p>${c.plea}</p></span><span class="lv">${k === 'merge' ? 'Night' : 'Level'}<b>${S.lv[k]}</b><em>${STARSM}${S.got[k] || 0}</em></span>`;
    b.onclick = () => { sfx.tap(); openGame(k); };
    crew.append(b);
  });
  $('#fact').innerHTML = `${PAWI(22)}<span><b>Raccoon fact</b>${FACTS[rnd(FACTS.length)]}</span>`;
  $('#dedi').hidden = !DEDICATION; $('#dedi').textContent = DEDICATION;
}

function renderScene() { $('#scene').innerHTML = region().scene(freshBuild); }

function renderProject() {
  const box = $('#project'), R = region(), list = R.list, p = nextProject();
  // The alley is done and the forest is waiting: point at the map rather than the party.
  if (!p && mapNews()) {
    box.innerHTML = `<div class="pface">${coon('willow', 52)}</div><div class="pbody"><span class="eyebrow">${R.party.done}</span><h3>A new place on the map</h3>
      <p>“A pigeon dropped off a leaf letter from cousin Willow. There's a forest on the map now, up the creek past the last streetlamp.”</p></div>`;
    const b = h('button', 'btn', 'Open the map'); b.onclick = () => { sfx.tap(); openMap(); };
    box.querySelector('.pbody').append(b);
    return;
  }
  const P = R.party, cost = p ? p.cost : PARTY_COST, k = p ? p.k : P.k, can = S.stars >= cost;
  const pct = Math.min(100, Math.round(S.stars / cost * 100));
  const head = p ? `<span class="eyebrow">Project ${builtIn(list) + 1} of ${list.length}</span><h3>${p.name}</h3><p>“${p.ask}”</p>`
    : `<span class="eyebrow">${P.done}</span><h3>${P.name}</h3><p>“${P.invite} ${PARTY_CAPS} caps.”${S.parties ? ` ${plural(S.parties, 'party')} so far.` : ''}</p>`;
  box.innerHTML = `<div class="pface">${coon(k, 52)}</div><div class="pbody">${head}
    <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${cost}" aria-valuenow="${Math.min(S.stars, cost)}"><i style="width:${pct}%"></i><span>${STARSM} ${Math.min(S.stars, cost)} / ${cost}</span></div></div>`;
  const b = h('button', 'btn' + (can ? '' : ' ghost'), can ? (p ? `Build · ${cost} ★` : `${P.verb} · ${cost} ★`) : `Need ${cost - S.stars} more ★`);
  b.disabled = !can;
  b.onclick = () => p ? build(p) : party();
  box.querySelector('.pbody').append(b);
}
function build(p) {
  if (S.stars < p.cost) return;
  S.stars -= p.cost; S.town.push(p.id); save();
  freshBuild = p.id; renderHub(); sfx.win(); buzz([20, 40, 20]);
  $('#scene').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  const last = !nextProject(), forest = S.region === 'forest';
  const thanks = { k: p.k, title: `${p.name} built!`, text: p.thanks };
  const toMap = { label: 'Open the map', primary: true, fn: () => { hideModal(); openMap(); } };
  if (last && !forest && !S.trip) Object.assign(thanks, { text: p.thanks + '<br><br>Wait. Is that a pigeon on the lamp? It dropped off a leaf letter, and a new place has appeared on your map.',
    buttons: [toMap, { label: 'Later', fn: hideModal }] });
  else if (last && forest) Object.assign(thanks, { text: p.thanks + `<br><br>Mossy Hollow is mended. From now on, spend ${PARTY_COST} ★ on a forest feast whenever you like. Keep an eye on the map: the crew has heard rumours of other places.`,
    buttons: [{ label: 'Hooray!', primary: true, fn: hideModal }, { ...toMap, primary: false }] });
  else thanks.buttons = [{ label: 'Lovely', primary: true, fn: hideModal }];
  setTimeout(() => showModal(thanks), 900);
}
function party() {
  if (S.stars < PARTY_COST) return;
  const P = region().party;
  S.stars -= PARTY_COST; S.parties++; S.caps += PARTY_CAPS; save(); renderHub(); sfx.win();
  showModal({ k: ORDER[S.parties % 5], title: `${P.name}!`, text: P.text,
    html: rewardHTML(PARTY_CAPS), buttons: [{ label: 'Lovely', primary: true, fn: hideModal }] });
}
$('#muteBtn').onclick = () => { S.muted = !S.muted; save(); renderHub(); sfx.tap(); };

function askName() {
  showModal({ k: 'bingo', title: 'Who is helping tonight?', text: 'The raccoons would like to know who to thank.',
    html: `<input id="nameInput" maxlength="20" placeholder="Your name" autocomplete="off" value="${esc(S.name)}">`,
    buttons: [{ label: 'Meet the raccoons', primary: true, fn: () => { S.name = $('#nameInput').value.trim() || 'friend'; save(); hideModal(); renderHub(); } }] });
  setTimeout(() => { const i = $('#nameInput'); if (i) i.onkeydown = e => { if (e.key === 'Enter') $('#mBtns button').click(); }; }, 0);
}

  { id: 'berries', name: 'Berry bushes', cost: 10, k: 'merge', ask: 'No bins out here means no leftovers. If we plant berry bushes I can still cook for everyone.', thanks: 'Blueberries and raspberries. Forest pie is back on the menu.' },

function forestSVG(freshId) {
  const ink = '#2a2640', has = id => built(id), cls = id => `pj${id === freshId ? ' new' : ''}`;
  const bark = '#6b4a33', leaf = '#2c6743', leaf2 = '#3a7f52';
  let s = `<svg viewBox="0 0 360 230" role="img" aria-label="Mossy Hollow: ${builtIn(FOREST)} of ${FOREST.length} projects built">
  <defs>
    <linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d22"/><stop offset="1" stop-color="#16382f"/></linearGradient>
    <radialGradient id="ffly"><stop offset="0" stop-color="#e9ff8f" stop-opacity=".85"/><stop offset="1" stop-color="#e9ff8f" stop-opacity="0"/></radialGradient>
    <radialGradient id="fwarm"><stop offset="0" stop-color="#ffb547" stop-opacity=".5"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></radialGradient>
    <radialGradient id="fcyan"><stop offset="0" stop-color="#7ff0e6" stop-opacity=".55"/><stop offset="1" stop-color="#7ff0e6" stop-opacity="0"/></radialGradient>
  </defs>

function playTrip(onDone) {
  const alley = () => sceneSVG(null);
  const shots = [
    { k: 'bingo', bg: '#1b1836', art: alley, text: 'Look at this place. A lamp, a red door, a fire to sit around. This alley is a real home now.' },
    { k: 'stack', bg: '#1b1836', art: () => alley().replace(/<\/svg>$/, pigeonSVG() + '</svg>'), text: 'Hold on. A pigeon just landed on the lamp. It\'s got a leaf in its beak, with writing scratched on it.' },
    { k: 'sort', bg: '#1d2238', art: () => `<div class="letter"><p>Dear city cousins,</p><p>A big storm blew through Mossy Hollow. The old oak cracked open, our stools and swing blew away, and the little ones are scared.</p><p>We hear you are good at fixing things. Could you come?</p><p class="sig">Love, Willow 🍂</p></div>`, bare: true, text: 'It\'s from cousin Willow in the forest! And look, she drew a map on the back.' },

    { k: 'willow', bg: '#102620', art: () => forestSVG(null), text: 'You came! Welcome to Mossy Hollow. It\'s a mess after the storm, but I know we can fix it together.' },

const PLACES = [

  { id: 'forest', name: 'Mossy Hollow', x: 252, y: 290, blurb: 'Cousin Willow\'s forest, up the creek past the last streetlamp.',
    hint: 'Something keeps rustling past the last streetlamp. Finish fixing up the alley to find out what.' },
  { id: 'cove', x: 92, y: 178, hint: 'Rosie swears she can smell salt and hot chips on the wind from over this way.' },

// here: the crew is here. open: can travel. locked: unlocks when the current place is finished. soon: not built yet.
function placeState(id) {
  if (id === S.region) return 'here';
  if (id === 'alley') return 'open';
  if (id === 'forest') return S.trip || finished('alley') ? 'open' : 'locked';
  return 'soon';
}
// A place that just unlocked and hasn't been visited gets a pulsing ring and a dot on the map button.
const mapNews = () => !S.trip && placeState('forest') === 'open';

/* ---------- save codes ---------- */
// Saves live in this browser only, so a code is how progress moves between phones, or from Safari into the home-screen app.
const CODE_PREFIX = 'TPT1-';
function saveCode() {
  const bytes = new TextEncoder().encode(JSON.stringify(S));
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return CODE_PREFIX + btoa(bin);
}
function readCode(text) {
  const raw = (text || '').replace(/\s+/g, '');
  const at = raw.indexOf(CODE_PREFIX);
  if (at < 0) return null;
  try {
    const bin = atob(raw.slice(at + CODE_PREFIX.length));
    const data = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    return data && typeof data === 'object' && data.lv && Array.isArray(data.town) ? cleanSave(data) : null;
  } catch (e) { return null; }
}
// A pasted code is untrusted text (anyone could send one), and parts of the save are drawn as HTML.
// So the save is rebuilt from the fields the game knows, as numbers, flags and known project ids only.
function cleanSave(d) {
  const out = fresh(), obj = v => (v && typeof v === 'object' ? v : {});
  const num = (v, min = 0, max = 1e7) => { const n = Math.floor(+v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : null; };
  const ids = new Set([...ALLEY, ...FOREST].map(p => p.id));
  out.name = String(d.name || '').slice(0, 20);
  out.muted = !!d.muted;
  out.region = d.region === 'forest' ? 'forest' : 'alley';
  out.trip = d.trip ? 1 : 0;
  out.town = [...new Set(Array.isArray(d.town) ? d.town.filter(id => ids.has(id)) : [])];
  ['caps', 'stars', 'totalStars', 'helps', 'parties'].forEach(k => { out[k] = num(d[k]) ?? out[k]; });
  if (d.stackBest != null) out.stackBest = num(d.stackBest) ?? 0;
  ORDER.forEach(k => {
    out.lv[k] = num(obj(d.lv)[k], 1, 9999) ?? 1;
    out.got[k] = num(obj(d.got)[k]) ?? 0;
    if (obj(d.tut)[k]) out.tut[k] = 1;
    const best = {};
    Object.entries(obj(obj(d.best)[k])).forEach(([L, st]) => { const l = num(L, 1, 9999), n = num(st, 0, 3); if (l != null && n != null) best[l] = n; });
    if (Object.keys(best).length) out.best[k] = best;
  });
  return out; // An unfinished kitchen night isn't carried over; it restarts fresh.
}
function copyText(text, box) {
  // The clipboard API needs https; the old LAN address is plain http, so fall back to selecting the box.
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => false);
  try {
    box.removeAttribute('readonly'); box.focus(); box.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    box.setAttribute('readonly', ''); box.blur();
    return Promise.resolve(ok);
  } catch (e) { return Promise.resolve(false); }
}
const saveSummary = d => {
  const parts = [`${d.town.filter(id => ALLEY.some(p => p.id === id)).length} of ${ALLEY.length} alley projects`];
  if (d.trip || d.region === 'forest') parts.push(`${d.town.filter(id => FOREST.some(p => p.id === id)).length} of ${FOREST.length} forest projects`);
  parts.push(`${d.stars || 0} ★`, `${d.caps || 0} caps`);
  return parts.join(', ');
};

/* ---------- updates ---------- */
// Every build publishes version.json. When a newer build is out, reload while she's sitting on the town screen.
let updateTried = '';
function checkForUpdate() {
  if (!/^https?:$/.test(location.protocol)) return;
  fetch('version.json', { cache: 'no-store' }).then(r => r.json()).then(v => {
    if (!v.build || v.build === BUILD || v.build === updateTried) return;
    // One try per build, so a slow CDN can't cause a reload loop.
    try { if (sessionStorage.getItem('tpt-tried') === v.build) return; sessionStorage.setItem('tpt-tried', v.build); sessionStorage.setItem('tpt-note', v.note || ''); } catch (e) {}
    updateTried = v.build;
    const idle = () => !curKey && $('#modal').hidden && !$('.cine') && !$('.mapview');
    if (idle()) location.reload();
    else { const t = setInterval(() => { if (idle()) { clearInterval(t); location.reload(); } }, 1500); }
  }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
function afterReload() {
  try {
    if (sessionStorage.getItem('tpt-loaded')) { sessionStorage.removeItem('tpt-loaded'); setTimeout(() => toast('Save loaded. Welcome back!'), 700); return; }
    if (sessionStorage.getItem('tpt-tried') === BUILD) {
      const note = sessionStorage.getItem('tpt-note'); sessionStorage.removeItem('tpt-tried');
      setTimeout(() => toast(note ? `Updated! ${note}` : 'Updated to the newest version.'), 700);
    }
  } catch (e) {}
}

/* =====================================================================
   Snack Pop engine: pure game logic, no DOM. The UI replays its frames.
   ===================================================================== */
const PopEngine = (() => {
  const ROWS = 9, COLS = 8;
  const K = (r, c) => r * COLS + c;
  function rand(st) {
    st.seed = (st.seed + 0x6D2B79F5) | 0;
    let t = Math.imul(st.seed ^ (st.seed >>> 15), 1 | st.seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const ri = (st, n) => Math.floor(rand(st) * n);
  const grid0 = () => Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  const movable = o => !!o && o.k !== 'crate';

  /* ---------- level design ---------- */
  const SHAPES = {
    middle: (r, c) => Math.abs(r - 4) + Math.abs(c - 3.5),
    bottom: (r, c) => (ROWS - 1 - r) * 1.6 + Math.abs(c - 3.5) * .4,
    top: (r, c) => r * 1.6 + Math.abs(c - 3.5) * .4,
    frame: (r, c) => Math.min(r, ROWS - 1 - r, c, COLS - 1 - c) * 3,
    cross: (r, c) => Math.min(Math.abs(r - 4), Math.abs(c - 3.5)) * 2.5,
    corners: (r, c) => Math.min(Math.hypot(r, c), Math.hypot(ROWS - 1 - r, c)),
  };
  function pickSym(R, shape, count, ok) {
    const half = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS / 2; c++)
      if (ok(r, c) && ok(r, COLS - 1 - c)) half.push({ r, c, m: SHAPES[shape](r, c) + rand(R) * .9 });
    half.sort((a, b) => a.m - b.m);
    const out = [];
    for (const p of half) { if (out.length >= count) break; out.push([p.r, p.c], [p.r, COLS - 1 - p.c]); }
    return out;
  }
  // Moves per level come from bot simulations (tools/calibrate-pop.js). Beyond the table, levels repeat the last cycle.
  const MOVES = [14, 20, 15, 22, 17, 29, 24, 16, 18, 25, 19, 11, 22, 34, 35, 18, 23, 29, 25, 25, 28, 30, 32, 22, 28, 18, 32, 24, 29, 30, 38, 27, 24, 29, 32, 33, 28, 24, 33, 28, 28, 29, 33, 33, 27, 29, 28, 33];
  function level(L) {
    const base = L > 48 ? 37 + ((L - 37) % 12) : L;
    const R = { seed: L * 7919 + 101 };
    const theme = ['collect', 'jam', 'crate', 'acorn'][(base - 1) % 4];
    const t = Math.floor((base - 1) / 4);
    const cfg = { L, theme, types: base <= 2 ? 5 : 6, jam: grid0(), crates: grid0(), collect: {}, acorns: 0, acornMax: 1, moves: MOVES[base - 1] || 30 };
    const pickShape = list => list[ri(R, list.length)];
    const free = (r, c) => !cfg.crates[r][c] && !cfg.jam[r][c];
    const addCrates = (n, shape, hp2) => {
      const rowCount = Array(ROWS).fill(0);
      pickSym(R, shape, n, (r, c) => r > 0 && r < ROWS - 1 && free(r, c)).forEach(([r, c], i) => {
        if (rowCount[r] >= COLS - 2) return;
        rowCount[r]++; cfg.crates[r][c] = i < n * hp2 ? 2 : 1;
      });
    };
    const addJam = (n, shape, dbl) => pickSym(R, shape, n, free).forEach(([r, c], i) => { cfg.jam[r][c] = i < n * dbl ? 2 : 1; });
    const goalTypes = k => { const ts = []; while (ts.length < k) { const x = ri(R, cfg.types); if (!ts.includes(x)) ts.push(x); } return ts; };
    if (theme === 'collect') {

        ? '<span class="tr hid">?</span>'
        : `<span class="tr${k >= j.length - up ? ' up' : ''}" style="background:${TR[v.t][1]}">${TR[v.t][0]}</span>`).join('')}</div>`;
      b.onclick = () => tap(i, b);
      wrapEl.append(b);
    });
  }
  function anyMove() { return jars.some((A, a) => jars.some((B, b) => a !== b && A.length && !done(A) && B.length < CAP4 && (!B.length || top(B).t === top(A).t))); }
  function tap(i, b) {
    if (modalOpen() || finished) return;
    if (sel < 0) {
      if (!jars[i].length || done(jars[i])) { shakeEl(b); return; }
      sel = i; sfx.tap(); render(); return;
    }
    if (sel === i) { sel = -1; render(); return; }
    const A = jars[sel], B = jars[i];
    if (B.length >= CAP4 || (B.length && top(B).t !== top(A).t)) {
      sfx.bad();
      sel = B.length && !done(B) ? i : -1;
      render(); shakeEl(wrapEl.children[i]); return;
    }
    hist.push(JSON.stringify(jars));
    let k = Math.min(runLen(A), CAP4 - B.length);
    while (k--) B.push(A.pop());
    let revealed = false;
    if (A.length && top(A).h) { top(A).h = false; revealed = true; }
    sel = -1; movesN++;
    if (done(B)) { sfx.good(); buzz(20); } else if (revealed) tone(880, .08, 'triangle', .05); else sfx.pop();
    render(); stats();
    if (jars.every(j => !j.length || done(j))) { finished = true; setTimeout(() => alive && finish(), 350); return; }
    if (!anyMove()) setTimeout(() => alive && stuck(), 300);
  }
  function finish() {
    const stars = extra ? 1 : (undos || restarts) ? 2 : 3;
    win('sort', { stars, caps: 8 + n * 2 + 5 * stars, title: 'Stash sorted!',
      text: `Every jar holds four of a kind, and Juniper can finally find her favourite key. Done in ${movesN} moves${stars === 3 ? ' without a single do-over' : ''}.` });
  }
  function stuck() {
    showModal({ k: 'sort', title: 'No moves left', text: 'Every jar is full or blocked. Juniper has a few ideas.', buttons: [
      { label: 'Undo last pour', primary: true, disabled: !hist.length, fn: () => { hideModal(); undo(); } },
      { label: `Add a jar · ${CAPSM} ${JAR_COST}`, disabled: extra || S.caps < JAR_COST, note: !extra && S.caps < JAR_COST ? `You have ${S.caps} caps.` : '', fn: () => { hideModal(); addJar(); } },
      { label: 'Restart level', fn: () => { hideModal(); doRestart(); } },
      { label: 'Back to town', fn: closeGame },
    ] });
  }
  function undo() {
    if (!hist.length || finished) return;
    if (undos >= FREE_UNDO && !spend(UNDO_COST)) return;
    undos++; jars = JSON.parse(hist.pop()); sel = -1; sfx.tap(); render(); stats();
  }
  function doRestart() { if (finished) return; jars = JSON.parse(start); if (extra) jars.push([]); hist = []; sel = -1; movesN = 0; restarts++; layout(); stats(); sfx.tap(); }
  function addJar() {
    if (extra || finished || !spend(JAR_COST)) return;
    extra = true; jars.push([]); sel = -1; say('Here, borrow my spare jar.'); layout(); stats(); sfx.good();
  }
  return { mount, unmount, layout, _gen: gen, _solvable: solvable };
})();


const GAMES = { pop: Pop, merge: Kitchen, stack: Stack, bingo: Bingo, sort: Sort };

/* ---------- boot ---------- */
let rz;
const relayout = () => { clearTimeout(rz); rz = setTimeout(() => { if (mounted && cur.layout) cur.layout(); }, 120); };
window.addEventListener('resize', relayout);
// iOS ignores user-scalable=no, so pinch and double-tap zoom are blocked here as well as by touch-action in the CSS.
['gesturestart', 'gesturechange', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
// The stage also changes size when the controls row wraps or a button label grows mid-game.
if (window.ResizeObserver) new ResizeObserver(relayout).observe(stage);
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}

function boot(data) {
  const saved = (data && data.S) || load() || {}, base = fresh();
  S = Object.assign(base, saved);
  ['lv', 'got', 'best', 'tut'].forEach(k => { S[k] = Object.assign(fresh()[k], saved[k] || {}); });
  if (!Array.isArray(S.town)) S.town = [];
  if (S.region !== 'forest') S.region = 'alley';
  // Saves from before the map: a crew already in the forest has made the trip.
  if (S.region === 'forest') S.trip = 1;
  delete S.viewing;
  const gift = S.migrated; delete S.migrated; S.v = 2;
  save(); applyRegion(); renderHub(); updateCaps();
  if (gift) setTimeout(() => toast('Welcome back! The raccoons found 50 bonus caps for you.'), 600);
  if (!S.name) askName();
  afterReload(); setTimeout(checkForUpdate, 3000);
  if (/[?&]test\b/.test(location.search)) window.__tpt = { openGame, closeGame, GAMES, playTrip, openMap, travelTo, closeMap, renderHub, applyRegion, coon, ALLEY, FOREST, get S() { return S; }, get audio() { return AC && AC.state; } };
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

})();
